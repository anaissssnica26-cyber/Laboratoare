<!DOCTYPE html>
<html>
<head>
    <title>Bonus: Garaj Auto (Tablou de Obiecte)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .box { padding: 15px; margin-bottom: 20px; border: 1px solid #ccc; background-color: #f9f9f9; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #aaa; padding: 8px; text-align: center; }
        th { background-color: #eee; }
        button.delete-btn { background-color: red; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body onload="afiseazaGaraj()">

    <h2>Garaj Auto (JSON Array in Local Storage)</h2>
    
    <div class="box">
        <form onsubmit="return adaugaMasina()">
            <label for="tip">Tip:</label> <input id="tip" required>
            <label for="model">Model:</label> <input id="model" required>
            <label for="culoare">Culoare:</label> <input id="culoare" required>
            <label for="an">An:</label> <input type="number" id="an" style="width:60px;" required>
            <button type="submit" style="background-color: green; color: white;">Adaugă în Garaj</button>
        </form>
        <p id="totalMasini" style="font-weight: bold;"></p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Nr.</th>
                <th>Tip</th>
                <th>Model</th>
                <th>Culoare</th>
                <th>An</th>
                <th>Acțiune</th>
            </tr>
        </thead>
        <tbody id="corpTabel">
        </tbody>
    </table>

<script>
    function preiaGaraj() {
        var textGaraj = localStorage.getItem("garaj");
        if (textGaraj) {
            return JSON.parse(textGaraj);
        }
        return [];
    }

    function adaugaMasina() {
        var garaj = preiaGaraj();
        
        var masinaNoua = {
            tip: document.getElementById("tip").value,
            model: document.getElementById("model").value,
            culoare: document.getElementById("culoare").value,
            anFab: Number(document.getElementById("an").value)
        };
        
        garaj.push(masinaNoua);
        localStorage.setItem("garaj", JSON.stringify(garaj));
        
        document.getElementById("tip").value = "";
        document.getElementById("model").value = "";
        document.getElementById("culoare").value = "";
        document.getElementById("an").value = "";
        
        afiseazaGaraj();
        return false;
    }

    function stergeMasina(index) {
        var garaj = preiaGaraj();
        garaj.splice(index, 1);
        localStorage.setItem("garaj", JSON.stringify(garaj));
        afiseazaGaraj();
    }

    function afiseazaGaraj() {
        var garaj = preiaGaraj();
        var tbody = document.getElementById("corpTabel");
        tbody.innerHTML = "";
        
        document.getElementById("totalMasini").innerHTML = "Total mașini în garaj: " + garaj.length;

        for (var i = 0; i < garaj.length; i++) {
            var rand = document.createElement("tr");
            
            rand.innerHTML = "<td>" + (i + 1) + "</td>" +
                             "<td>" + garaj[i].tip + "</td>" +
                             "<td>" + garaj[i].model + "</td>" +
                             "<td>" + garaj[i].culoare + "</td>" +
                             "<td>" + garaj[i].anFab + "</td>" +
                             "<td><button class='delete-btn' onclick='stergeMasina(" + i + ")'>Șterge</button></td>";
                             
            tbody.appendChild(rand);
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<body>
    <h1 id="titlu" onclick="schimbaCuloareText()">Titlu de câteva cuvinte</h1>
    <p id="paragraf" onclick="schimbaCuloareFundal()">
        Linia unu.<br>Linia doi.<br>Linia trei.
    </p>
    <script>
        function schimbaCuloareText() {
            var c = prompt("Introduceți culoarea textului:");
            if (CSS.supports("color", c)) {
                document.getElementById("titlu").style.color = c;
            } else if(c !== null) {
                alert("Culoare incorectă!");
            }
        }
        function schimbaCuloareFundal() {
            var c = prompt("Introduceți culoarea fundalului:");
            if (CSS.supports("color", c)) {
                document.getElementById("paragraf").style.backgroundColor = c;
            } else if(c !== null) {
                alert("Culoare incorectă!");
            }
        }
    </script>
</body>
</html>

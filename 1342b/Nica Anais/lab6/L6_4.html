<!DOCTYPE html>
<html>
<head>
<title>Modificare imagini la incarcare</title>
</head>
<body>

<h3>Imagine 1: Pisici</h3>
<img src="Pesti.jpg" width="200px">

<h3>Imagine 2: Caini</h3>
<img src="desert.jpg" width="200px">

<h3>Imagine 3: Munti</h3>
<img src="egrete.jpg" width="200px">

<h3>Imagine 4: Mare</h3>
<img src="jungla.jpg" width="200px">

<script>
    var imagini = document.getElementsByTagName("img");
    imagini[0].src = "Img/pisici.jpg";
    imagini[1].src = "Img/caini.jpg";
    imagini[2].src = "Img/munti.jpg";
    imagini[3].src = "Img/mare.jpg";
</script>

</body>
</html>
